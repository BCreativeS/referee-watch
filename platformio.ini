[env:twatch_ultra]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; =====================================================
; BUILD FLAGS
; FIXED: merged two duplicate build_flags blocks into one.
; The first block was silently dropped by PlatformIO when the key
; appeared twice. ${env.build_flags} also referenced a nonexistent
; [env] section and would have resolved to empty.
; =====================================================

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -I src/core
    -I src/hardware
    -I src/ui
    -I test

; =====================================================
; FILESYSTEM / PARTITIONS
; =====================================================

board_build.partitions = huge_app.csv

; =====================================================
; LIBRARIES
; =====================================================

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit DRV2605 Library @ ^1.2.2
    lewisxhe/XPowersLib @ ^0.2.3

; =====================================================
; SERIAL MONITOR
; =====================================================

monitor_filters =
    esp32_exception_decoder
    time

; =====================================================
; BUILD OPTIONS
; FIXED: removed duplicate build_flags block and build_unflags.
; -std=gnu++17 is already in the merged build_flags above.
; =====================================================

; =====================================================
; OPTIMIZATION
; =====================================================

build_type = debug